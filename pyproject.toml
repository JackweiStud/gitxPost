[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xpost"
version = "0.1.0"
description = "Local CLI for X Article publishing"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "undetected-chromedriver>=3.5.0",
  "selenium>=4.0.0",
  "pyobjc-framework-Cocoa>=10.0",
  "markdown>=3.5.0",
  "beautifulsoup4>=4.12.0",
  "html2text>=2020.1.16",
  "Pillow>=10.0.0",
]

[project.scripts]
xpost = "xpost:main"

[tool.setuptools]
py-modules = ["xpost"]
