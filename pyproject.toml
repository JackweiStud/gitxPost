[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xpost"
version = "0.1.0"
description = "Local macOS CLI for X Articles, X Posts, and Grok hot-post automation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "patchright>=1.58.1",
  "pyobjc-framework-Cocoa>=10.0",
  "Pillow>=10.0.0",
]

[project.scripts]
xpost = "xpost:main"

[tool.setuptools]
py-modules = ["xpost"]
