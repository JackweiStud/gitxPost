<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1050" font-family="'SF Pro Display', 'PingFang SC', -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a1a3e;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="skillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0.08"/>
    </linearGradient>
    <linearGradient id="cliGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.08"/>
    </linearGradient>
    <linearGradient id="scriptGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0.08"/>
    </linearGradient>
    <linearGradient id="extGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0.08"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowWhite" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <marker id="arrowCyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="1050" fill="url(#bgGrad)" rx="16"/>

  <!-- Title -->
  <text x="550" y="45" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="700">gitxPost — X Article 自动发布工具 架构总览</text>
  <text x="550" y="68" text-anchor="middle" fill="#64748b" font-size="13">Skill → CLI → 脚本 三层架构 &amp; 数据流</text>

  <!-- ==================== LAYER 1: SKILL ==================== -->
  <rect x="30" y="90" width="1040" height="195" rx="12" fill="url(#skillGrad)" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="55" y="115" fill="#a5b4fc" font-size="14" font-weight="700">LAYER 1 — Skill 层（AI Agent 接口）</text>
  <text x="55" y="132" fill="#64748b" font-size="11">AI Agent / LLM 通过 Skill 描述发现并调用能力，所有输出为 JSON</text>

  <!-- Skill boxes -->
  <rect x="55" y="148" width="300" height="55" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" filter="url(#shadow)"/>
  <text x="70" y="170" fill="#c7d2fe" font-size="12" font-weight="600">xpost-cli / SKILL.md</text>
  <text x="70" y="188" fill="#818cf8" font-size="10">init | validate | parse | publish | doctor</text>

  <rect x="395" y="148" width="300" height="55" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" filter="url(#shadow)"/>
  <text x="410" y="170" fill="#c7d2fe" font-size="12" font-weight="600">x-article-publisher / SKILL.md</text>
  <text x="410" y="188" fill="#818cf8" font-size="10">Playwright MCP 浏览器自动化发布方案</text>

  <rect x="735" y="148" width="300" height="55" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" filter="url(#shadow)"/>
  <text x="750" y="170" fill="#c7d2fe" font-size="12" font-weight="600">auto-imgByMdCn.md (Workflow)</text>
  <text x="750" y="188" fill="#818cf8" font-size="10">AI 自动配图工作流 (Antigravity)</text>

  <!-- Agent example -->
  <rect x="55" y="215" width="300" height="45" rx="8" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1" stroke-dasharray="4,3" filter="url(#shadow)"/>
  <text x="70" y="237" fill="#a5b4fc" font-size="11" font-weight="600">scripts/agent_example.py</text>
  <text x="70" y="251" fill="#6366f1" font-size="10">Agent 调用示例: init → validate → publish</text>

  <!-- ==================== LAYER 2: CLI ==================== -->
  <rect x="30" y="305" width="1040" height="175" rx="12" fill="url(#cliGrad)" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="55" y="330" fill="#67e8f9" font-size="14" font-weight="700">LAYER 2 — CLI 层（命令行入口）</text>
  <text x="55" y="347" fill="#64748b" font-size="11">xpost.py — 统一 CLI 入口，pip install -e . 后可全局使用 xpost 命令</text>

  <!-- CLI subcommands -->
  <rect x="55" y="362" width="155" height="50" rx="8" fill="#083344" stroke="#06b6d4" stroke-width="1" filter="url(#shadow)"/>
  <text x="132" y="383" text-anchor="middle" fill="#22d3ee" font-size="12" font-weight="700">xpost init</text>
  <text x="132" y="400" text-anchor="middle" fill="#67e8f9" font-size="9">生成文章骨架</text>

  <rect x="230" y="362" width="155" height="50" rx="8" fill="#083344" stroke="#06b6d4" stroke-width="1" filter="url(#shadow)"/>
  <text x="307" y="383" text-anchor="middle" fill="#22d3ee" font-size="12" font-weight="700">xpost validate</text>
  <text x="307" y="400" text-anchor="middle" fill="#67e8f9" font-size="9">模板格式预检</text>

  <rect x="405" y="362" width="155" height="50" rx="8" fill="#083344" stroke="#06b6d4" stroke-width="1" filter="url(#shadow)"/>
  <text x="482" y="383" text-anchor="middle" fill="#22d3ee" font-size="12" font-weight="700">xpost parse</text>
  <text x="482" y="400" text-anchor="middle" fill="#67e8f9" font-size="9">Markdown → JSON</text>

  <rect x="580" y="362" width="155" height="50" rx="8" fill="#083344" stroke="#06b6d4" stroke-width="1" filter="url(#shadow)"/>
  <text x="657" y="383" text-anchor="middle" fill="#22d3ee" font-size="12" font-weight="700">xpost publish</text>
  <text x="657" y="400" text-anchor="middle" fill="#67e8f9" font-size="9">草稿/发布到 X</text>

  <rect x="755" y="362" width="155" height="50" rx="8" fill="#083344" stroke="#06b6d4" stroke-width="1" filter="url(#shadow)"/>
  <text x="832" y="383" text-anchor="middle" fill="#22d3ee" font-size="12" font-weight="700">xpost doctor</text>
  <text x="832" y="400" text-anchor="middle" fill="#67e8f9" font-size="9">环境依赖检查</text>

  <!-- pyproject.toml note -->
  <rect x="55" y="425" width="200" height="30" rx="6" fill="#0c4a6e" stroke="#0891b2" stroke-width="0.8" stroke-dasharray="3,2"/>
  <text x="70" y="445" fill="#67e8f9" font-size="10">pyproject.toml → entry: xpost:main</text>

  <!-- ==================== LAYER 3: SCRIPTS ==================== -->
  <rect x="30" y="500" width="1040" height="260" rx="12" fill="url(#scriptGrad)" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="55" y="525" fill="#fcd34d" font-size="14" font-weight="700">LAYER 3 — 脚本层（核心功能实现）</text>
  <text x="55" y="542" fill="#64748b" font-size="11">Python 脚本实现 Markdown 解析、剪贴板操作、浏览器自动化等核心逻辑</text>

  <!-- Core scripts -->
  <rect x="55" y="558" width="240" height="80" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1" filter="url(#shadow)"/>
  <text x="70" y="580" fill="#fde68a" font-size="12" font-weight="600">auto_publish_uc.py</text>
  <text x="70" y="596" fill="#fbbf24" font-size="10">核心发布引擎</text>
  <text x="70" y="610" fill="#d97706" font-size="9">undetected-chromedriver 反检测</text>
  <text x="70" y="624" fill="#d97706" font-size="9">HumanBehaviorSimulator 人类行为模拟</text>

  <rect x="315" y="558" width="240" height="80" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1" filter="url(#shadow)"/>
  <text x="330" y="580" fill="#fde68a" font-size="12" font-weight="600">parse_markdown.py</text>
  <text x="330" y="596" fill="#fbbf24" font-size="10">Markdown 解析器</text>
  <text x="330" y="610" fill="#d97706" font-size="9">提取 title / cover / images / dividers</text>
  <text x="330" y="624" fill="#d97706" font-size="9">Markdown → HTML 转换 + 占位符定位</text>

  <rect x="575" y="558" width="240" height="80" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1" filter="url(#shadow)"/>
  <text x="590" y="580" fill="#fde68a" font-size="12" font-weight="600">copy_to_clipboard.py</text>
  <text x="590" y="596" fill="#fbbf24" font-size="10">系统剪贴板操作</text>
  <text x="590" y="610" fill="#d97706" font-size="9">图片复制 (AppKit/win32)</text>
  <text x="590" y="624" fill="#d97706" font-size="9">HTML 富文本复制 (跨平台)</text>

  <rect x="835" y="558" width="200" height="80" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1" filter="url(#shadow)"/>
  <text x="850" y="580" fill="#fde68a" font-size="12" font-weight="600">table_to_image.py</text>
  <text x="850" y="596" fill="#fbbf24" font-size="10">表格渲染</text>
  <text x="850" y="610" fill="#d97706" font-size="9">Markdown 表格 → PNG 图片</text>

  <!-- Config & Env -->
  <rect x="55" y="655" width="200" height="50" rx="8" fill="#451a03" stroke="#b45309" stroke-width="1" stroke-dasharray="4,3" filter="url(#shadow)"/>
  <text x="70" y="677" fill="#fde68a" font-size="11" font-weight="600">config.py</text>
  <text x="70" y="693" fill="#d97706" font-size="9">延迟/选择器/浏览器/重试配置</text>

  <rect x="275" y="655" width="200" height="50" rx="8" fill="#451a03" stroke="#b45309" stroke-width="1" stroke-dasharray="4,3" filter="url(#shadow)"/>
  <text x="290" y="677" fill="#fde68a" font-size="11" font-weight="600">pyEnv.py</text>
  <text x="290" y="693" fill="#d97706" font-size="9">Python/Playwright 环境检测</text>

  <!-- Prompts -->
  <rect x="495" y="655" width="280" height="50" rx="8" fill="#451a03" stroke="#b45309" stroke-width="1" stroke-dasharray="4,3" filter="url(#shadow)"/>
  <text x="510" y="677" fill="#fde68a" font-size="11" font-weight="600">CreateMd/prompts/</text>
  <text x="510" y="693" fill="#d97706" font-size="9">prompt_zara.md | prompt_tech.md | prompt_fun.md</text>

  <!-- Template -->
  <rect x="795" y="655" width="240" height="50" rx="8" fill="#451a03" stroke="#b45309" stroke-width="1" stroke-dasharray="4,3" filter="url(#shadow)"/>
  <text x="810" y="677" fill="#fde68a" font-size="11" font-weight="600">CreateMd/template.md</text>
  <text x="810" y="693" fill="#d97706" font-size="9">X Article 格式规范 (H1/封面/图片)</text>

  <!-- ==================== EXTERNAL ==================== -->
  <rect x="30" y="780" width="1040" height="80" rx="12" fill="url(#extGrad)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="55" y="805" fill="#6ee7b7" font-size="14" font-weight="700">外部依赖 &amp; 存储</text>

  <rect x="55" y="818" width="200" height="30" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="155" y="838" text-anchor="middle" fill="#34d399" font-size="11">Chrome (反检测浏览器)</text>

  <rect x="275" y="818" width="200" height="30" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="375" y="838" text-anchor="middle" fill="#34d399" font-size="11">chrome_data_mirror/ (登录态)</text>

  <rect x="495" y="818" width="200" height="30" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="595" y="838" text-anchor="middle" fill="#34d399" font-size="11">X.com Articles 编辑器</text>

  <rect x="715" y="818" width="200" height="30" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="815" y="838" text-anchor="middle" fill="#34d399" font-size="11">macOS 系统剪贴板</text>

  <!-- ==================== DATA FLOW ==================== -->
  <text x="550" y="895" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="700">数据流 (Publish 主流程)</text>

  <!-- Flow steps -->
  <rect x="45" y="910" width="120" height="44" rx="22" fill="#312e81" stroke="#6366f1" stroke-width="1.5"/>
  <text x="105" y="928" text-anchor="middle" fill="#c7d2fe" font-size="10" font-weight="600">Markdown</text>
  <text x="105" y="942" text-anchor="middle" fill="#818cf8" font-size="9">CreateMd/*.md</text>

  <line x1="165" y1="932" x2="195" y2="932" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowWhite)"/>

  <rect x="195" y="910" width="120" height="44" rx="8" fill="#083344" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="255" y="928" text-anchor="middle" fill="#22d3ee" font-size="10" font-weight="600">xpost validate</text>
  <text x="255" y="942" text-anchor="middle" fill="#67e8f9" font-size="9">格式预检</text>

  <line x1="315" y1="932" x2="345" y2="932" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowWhite)"/>

  <rect x="345" y="910" width="120" height="44" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="405" y="928" text-anchor="middle" fill="#fde68a" font-size="10" font-weight="600">parse_markdown</text>
  <text x="405" y="942" text-anchor="middle" fill="#fbbf24" font-size="9">→ JSON + HTML</text>

  <line x1="465" y1="932" x2="495" y2="932" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowWhite)"/>

  <rect x="495" y="910" width="120" height="44" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="555" y="928" text-anchor="middle" fill="#fde68a" font-size="10" font-weight="600">copy_to_clipboard</text>
  <text x="555" y="942" text-anchor="middle" fill="#fbbf24" font-size="9">HTML → 剪贴板</text>

  <line x1="615" y1="932" x2="645" y2="932" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowWhite)"/>

  <rect x="645" y="910" width="140" height="44" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="715" y="928" text-anchor="middle" fill="#fde68a" font-size="10" font-weight="600">auto_publish_uc</text>
  <text x="715" y="942" text-anchor="middle" fill="#fbbf24" font-size="9">Chrome 自动化操作</text>

  <line x1="785" y1="932" x2="815" y2="932" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowWhite)"/>

  <rect x="815" y="910" width="120" height="44" rx="22" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="875" y="928" text-anchor="middle" fill="#6ee7b7" font-size="10" font-weight="600">X Articles</text>
  <text x="875" y="942" text-anchor="middle" fill="#34d399" font-size="9">草稿 / 发布</text>

  <!-- Flow detail labels -->
  <text x="550" y="975" text-anchor="middle" fill="#64748b" font-size="11">
    .md → 预检 → 解析(title/cover/images/html) → 剪贴板 → 反检测浏览器 → 模拟人类操作 → X.com
  </text>

  <!-- Layer connection arrows (vertical) -->
  <!-- Skill → CLI -->
  <line x1="205" y1="260" x2="205" y2="305" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowWhite)"/>
  <line x1="545" y1="203" x2="545" y2="305" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowWhite)"/>

  <!-- CLI → Scripts -->
  <line x1="132" y1="412" x2="132" y2="500" stroke="#22d3ee" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowCyan)"/>
  <line x1="482" y1="412" x2="435" y2="558" stroke="#22d3ee" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowCyan)"/>
  <line x1="657" y1="412" x2="175" y2="558" stroke="#22d3ee" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowCyan)"/>

  <!-- Scripts → External -->
  <line x1="175" y1="638" x2="155" y2="780" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowAmber)"/>
  <line x1="695" y1="638" x2="815" y2="780" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowAmber)"/>

  <!-- Legend -->
  <text x="55" y="1010" fill="#64748b" font-size="10">图例：</text>
  <line x1="90" y1="1007" x2="120" y2="1007" stroke="#6366f1" stroke-width="2"/>
  <text x="125" y="1011" fill="#a5b4fc" font-size="10">Skill 层</text>
  <line x1="185" y1="1007" x2="215" y2="1007" stroke="#06b6d4" stroke-width="2"/>
  <text x="220" y="1011" fill="#67e8f9" font-size="10">CLI 层</text>
  <line x1="265" y1="1007" x2="295" y2="1007" stroke="#f59e0b" stroke-width="2"/>
  <text x="300" y="1011" fill="#fcd34d" font-size="10">脚本层</text>
  <line x1="355" y1="1007" x2="385" y2="1007" stroke="#10b981" stroke-width="2"/>
  <text x="390" y="1011" fill="#6ee7b7" font-size="10">外部依赖</text>
  <line x1="460" y1="1007" x2="490" y2="1007" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="495" y="1011" fill="#94a3b8" font-size="10">调用关系</text>
</svg>
